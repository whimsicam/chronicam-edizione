name: Deploy

# Vive nel repo PUBBLICO (whimsicam/chronicam-edizione), che contiene solo questo file.
# Legge site/ dal repo privato e la pubblica su GitHub Pages sotto un percorso non indovinabile:
# nel repo pubblico non viene mai salvato nessun contenuto.
on:
  repository_dispatch:
    types: [publish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          repository: whimsicam/chronicam
          token: ${{ secrets.PUBLISH_TOKEN }}
          path: src
          sparse-checkout: |
            site
            sources.yaml
          sparse-checkout-cone-mode: false
      - name: Prepara il sito
        run: |
          slug=$(sed -n 's/^  slug: *"\([^"]*\)".*/\1/p' src/sources.yaml)
          test -n "$slug"
          echo "::add-mask::$slug"
          mkdir -p "_site/$slug"
          cp -r src/site/. "_site/$slug/"
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          printf '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>.</title>\n' > _site/index.html
          cp _site/index.html _site/404.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - uses: actions/deploy-pages@v4
      - name: Cancella l'artefatto, che in un repo pubblico resterebbe scaricabile
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
